# Sample milestones after 2015: confirm with KUMASA.
- year: 2015
  title: KUMASA founded
  description: Kuntaw clubs come together under one organisation and one badge.
- year: 2018
  title: First National Open
  description: Clubs from Luzon, the Visayas and Mindanao compete under one set of rules.
- year: 2022
  title: One syllabus for every club
  description: The KUMASA grading syllabus is published for all member clubs.
